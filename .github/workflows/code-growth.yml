name: Update code growth
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/metrics/**'
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: code-growth
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate hand-drawn chart
        run: python scripts/code_growth.py
      - name: Commit updated chart
        run: |
          git add docs/metrics/code-growth.svg docs/metrics/code-growth.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: update code growth chart'
          git push origin HEAD:main
