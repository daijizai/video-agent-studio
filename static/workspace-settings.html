<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>应用设置 · Frame Studio</title><link rel="stylesheet" href="workspace-home.css?v=global-settings-6"><link rel="stylesheet" href="workspace-settings.css?v=1"></head>
<body><header class="top"><a class="brand" href="/workspace.html" aria-label="返回工作空间"><span>F</span> FRAME STUDIO</a><a class="settings-back" href="/workspace.html">← 工作空间</a></header><main class="settings-main"><div class="settings-heading"><h1>应用设置</h1><p>管理所有项目共用的供应商密钥。</p></div><section aria-labelledby="providers-title"><div class="section-head"><h2 id="providers-title">供应商连接</h2></div><p class="settings-note">已配置表示本机检测到密钥，连接状态尚未验证。</p><div id="global-providers" class="global-provider-grid" aria-live="polite"><p>正在读取供应商状态…</p></div><p id="settings-error" class="settings-message" role="alert"></p></section><section class="credential-panel" aria-labelledby="credential-title"><h2 id="credential-title">保存供应商密钥</h2><p>密钥只写入本机私密配置，保存后不会回显。</p><form id="credential-form"><label for="global-provider">供应商</label><select id="global-provider" required></select><label for="global-key">API 密钥</label><input id="global-key" type="password" autocomplete="off" spellcheck="false" required placeholder="输入对应供应商的密钥"><div class="credential-actions"><button type="submit" class="primary">保存密钥</button><span id="credential-result" role="status"></span></div></form></section></main><script src="workspace-settings.js?v=1"></script></body></html>
